<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="520" rx="28" fill="#0B1220"/>
  <text x="72" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Verification Loop</text>
  <text x="72" y="118" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="20">The product is useful because the workflow is explicit, evidence-backed, and replayable.</text>

  <rect x="72" y="188" width="182" height="96" rx="20" fill="#12314E"/>
  <text x="163" y="228" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Index</text>
  <text x="163" y="258" fill="#D7E6F5" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">RTL, docs, logs,</text>
  <text x="163" y="280" fill="#D7E6F5" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">coverage, prior runs</text>

  <rect x="310" y="188" width="182" height="96" rx="20" fill="#12314E"/>
  <text x="401" y="228" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Retrieve</text>
  <text x="401" y="258" fill="#D7E6F5" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">Task-aware context</text>
  <text x="401" y="280" fill="#D7E6F5" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">with citations</text>

  <rect x="548" y="170" width="226" height="132" rx="22" fill="#163B34"/>
  <text x="661" y="212" fill="#BBF7D0" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Run Workflow</text>
  <text x="661" y="244" fill="#DBFCE7" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">repair</text>
  <text x="661" y="266" fill="#DBFCE7" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">triage</text>
  <text x="661" y="288" fill="#DBFCE7" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">gen-sva / gen-cocotb / coverage-plan</text>

  <rect x="830" y="188" width="182" height="96" rx="20" fill="#3D2B1E"/>
  <text x="921" y="228" fill="#FED7AA" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Validate</text>
  <text x="921" y="258" fill="#FCE7D3" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">tool adapters,</text>
  <text x="921" y="280" fill="#FCE7D3" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">syntax and reruns</text>

  <rect x="1068" y="188" width="140" height="96" rx="20" fill="#2E1E47"/>
  <text x="1138" y="228" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Replay</text>
  <text x="1138" y="258" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">artifacts, runs,</text>
  <text x="1138" y="280" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">benchmarks</text>

  <path d="M254 236H310" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round"/>
  <path d="M492 236H548" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round"/>
  <path d="M774 236H830" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round"/>
  <path d="M1012 236H1068" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round"/>

  <rect x="132" y="362" width="1016" height="88" rx="18" fill="#0F1A2B" stroke="#20344F"/>
  <text x="640" y="399" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="700">Everything lands in the filesystem-backed run store under <tspan font-family="Consolas, monospace">.tel/</tspan></text>
  <text x="640" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Evidence, requests, responses, generated artifacts, validation status, waveform summaries, and replay metadata stay inspectable.</text>
</svg>
