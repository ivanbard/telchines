  <text x="104" y="521" fill="#E2E8F0" font-family="Consolas, monospace" font-size="18">run run_... produced 2 cluster(s)</text>
  <text x="104" y="549" fill="#94A3B8" font-family="Consolas, monospace" font-size="16">likely cause: missing stimulus or start-bit detection failure</text>

