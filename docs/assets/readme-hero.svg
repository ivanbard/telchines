  <text x="76" y="184" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800">Telchines</text>
  <text x="76" y="234" fill="#C6D4E3" font-family="Segoe UI, Arial, sans-serif" font-size="24">Grounded verification workflows for hardware teams.</text>
  <text x="76" y="270" fill="#C6D4E3" font-family="Segoe UI, Arial, sans-serif" font-size="24">Index specs, triage failures, generate assertions, scaffold tests,</text>
  <text x="76" y="306" fill="#C6D4E3" font-family="Segoe UI, Arial, sans-serif" font-size="24">and replay the whole loop with evidence.</text>

  <rect x="76" y="348" width="212" height="52" rx="14" fill="#0F766E"/>
  <text x="182" y="381" fill="#F8FAFC" font-family="Consolas, monospace" font-size="22" text-anchor="middle" font-weight="700">pip install telchines</text>

  <rect x="308" y="348" width="238" height="52" rx="14" fill="#13243A" stroke="#274A70"/>
  <text x="427" y="381" fill="#CFE4F7" font-family="Consolas, monospace" font-size="22" text-anchor="middle">tel gen-sva --spec ...</text>

