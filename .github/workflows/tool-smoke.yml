name: Tool Smoke

on:
  workflow_dispatch:

jobs:
  verilator-iverilog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Run real adapter smoke tests
        run: python scripts/tool_smoke.py --adapters verilator iverilog
