[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telchines"
version = "1.1.1"
description = "CLI-first verification workflow platform for grounded AI-assisted hardware validation"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Telchines contributors"},
]
keywords = [
  "asic",
  "fpga",
  "rtl",
  "verification",
  "sva",
  "cocotb",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "prompt_toolkit>=3.0,<4.0",
  "rich>=14.0,<15.0",
  "typer>=0.17,<1.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "pytest>=9.0",
]
cocotb-smoke = [
  "cocotb>=1.9",
]
slang-smoke = [
  "pyslang>=11.0",
]
agentic = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
]

[project.scripts]
tel = "telchines.cli:app"
telchines = "telchines.cli:app"

[project.urls]
Homepage = "https://github.com/ivanbard/telchines"
Repository = "https://github.com/ivanbard/telchines"
Issues = "https://github.com/ivanbard/telchines/issues"
Changelog = "https://github.com/ivanbard/telchines/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ivanbard/telchines/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telchines = ["benchmarks/*.json", "benchmarks/assets/**/*", "templates/*.json"]

[tool.setuptools.exclude-package-data]
telchines = ["benchmarks/assets/**/__pycache__/*", "benchmarks/assets/**/*.pyc", "benchmarks/assets/**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -p no:tmpdir"
