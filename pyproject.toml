[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telchines"
version = "0.1.0"
description = "Telchines verification workflow platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "prompt_toolkit>=3.0,<4.0",
  "rich>=14.0,<15.0",
  "typer>=0.17,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
tel = "telchines.cli:app"
telchines = "telchines.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -p no:tmpdir"
